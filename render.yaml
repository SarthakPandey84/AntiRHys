services:
  - type: web
    name: antirhys-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: MAX_CONCURRENT_SESSIONS
        value: "10"
      - key: ALLOWED_ORIGINS
        value: "https://antirhys.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: AUTH_TOKEN
        sync: false
      - key: SESSION_LOG_PATH
        value: "session_log.csv"
